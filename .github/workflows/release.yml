name: Release APK

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      version:
        description: Version name (MAJOR.MINOR / MAJOR.MINOR.PATCH)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.version || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build release or test APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Determine version and checkout ref
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
          SELECTED_REF: ${{ github.ref }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "release" ]]; then
            raw_version="$RELEASE_TAG"
            checkout_ref="$RELEASE_TAG"
            release_tag="$RELEASE_TAG"
          else
            raw_version="$INPUT_VERSION"
            checkout_ref="$SELECTED_REF"
            release_tag=""
          fi

          if [[ -z "$raw_version" ]]; then
            echo "::error::Version is empty."
            exit 1
          fi

          version="$raw_version"
          if [[ "${version:0:1}" == "v" || "${version:0:1}" == "V" ]]; then
            version="${version:1}"
          fi

          if [[ ! "$version" =~ ^(0|[1-9][0-9]?)\.(0|[1-9][0-9]?)(\.(0|[1-9][0-9]?))?$ ]]; then
            echo "::error::Invalid version: $raw_version (expected MAJOR.MINOR or MAJOR.MINOR.PATCH, each component 0..99 with no leading zeros, optionally prefixed with v)."
            exit 1
          fi

          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "checkout_ref=$checkout_ref" >> "$GITHUB_OUTPUT"

      - name: Checkout selected branch or release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.version.outputs.checkout_ref }}
          fetch-depth: 0

      - name: Prepare Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Check release exists
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null

      - name: Set up Java 27
        uses: actions/setup-java@v6
        with:
          java-version: '27'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success

      - name: Validate signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          for secret_name in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD; do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "::error::Missing secret: $secret_name"
              exit 1
            fi
          done

      - name: Prepare release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail

          printf '%s' "$ANDROID_KEYSTORE_BASE64" |
            base64 --decode > "$RUNNER_TEMP/kozu-release.jks"

          test -s "$RUNNER_TEMP/kozu-release.jks"

          keytool -list \
            -keystore "$RUNNER_TEMP/kozu-release.jks" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null

      - name: Generate version code from version name
        id: version_code
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$VERSION" == *.*.* ]]; then
            IFS='.' read -r major minor patch <<< "$VERSION"
            patch_slot=$((10#$patch + 2))
          else
            IFS='.' read -r major minor <<< "$VERSION"
            patch_slot=1
          fi

          version_code=$(((10#$major * 100 + 10#$minor) * 101 + patch_slot))
          if (( version_code < 1 || version_code > 2100000000 )); then
            echo "::error::Generated versionCode is outside Android's supported range: $version_code"
            exit 1
          fi

          echo "code=$version_code" >> "$GITHUB_OUTPUT"

      - name: Build Release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/kozu-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew clean :app:assembleRelease \
            "-PAPP_VERSION_NAME=$RELEASE_VERSION" \
            --stacktrace

      - name: Verify package APK
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          EXPECTED_VERSION_CODE: ${{ steps.version_code.outputs.code }}
        shell: bash
        run: |
          set -euo pipefail
          expected_version="$RELEASE_VERSION"

          tools="$(find "$ANDROID_HOME/build-tools" \
            -mindepth 1 -maxdepth 1 -type d |
            sort -V | tail -n 1)"

          test -x "$tools/apksigner"
          test -x "$tools/aapt"

          output="app/build/outputs/apk/release"
          mkdir -p dist

          variants=(
            "arm64-v8a:app-arm64-v8a-release.apk:kozu-arm64-v8a.apk"
            "armeabi-v7a:app-armeabi-v7a-release.apk:kozu-armeabi-v7a.apk"
            "universal:app-universal-release.apk:kozu-universal.apk"
            "x86:app-x86-release.apk:kozu-x86.apk"
            "x86_64:app-x86_64-release.apk:kozu-x86_64.apk"
          )

          expected_apks=(
            app-arm64-v8a-release.apk
            app-armeabi-v7a-release.apk
            app-universal-release.apk
            app-x86-release.apk
            app-x86_64-release.apk
          )
          mapfile -t actual_apks < <(
            find "$output" -maxdepth 1 -type f -name '*.apk' -printf '%f\n' |
              sort
          )

          if ! diff -u \
            <(printf '%s\n' "${expected_apks[@]}" | sort) \
            <(printf '%s\n' "${actual_apks[@]}"); then
            echo "::error::Release build must produce exactly the five expected APKs."
            echo "::error::Check ABI split configuration and build output metadata."
            exit 1
          fi

          reference_certificate=""

          for variant in "${variants[@]}"; do
            label="${variant%%:*}"
            remainder="${variant#*:}"
            filename="${remainder%%:*}"
            release_filename="${remainder#*:}"
            source="$output/$filename"
            destination="dist/$release_filename"

            if [[ ! -f "$source" ]]; then
              echo "::error::Missing APK: $source"
              find app/build/outputs/apk -maxdepth 5 -type f -print || true
              exit 1
            fi

            if ! unzip -tq "$source" >/dev/null; then
              echo "::error::APK archive validation failed: $filename"
              exit 1
            fi

            if ! signing_output="$(
              "$tools/apksigner" verify \
                --verbose \
                --print-certs \
                "$source" 2>&1
            )"; then
              echo "::error::APK signature verification failed: $filename"
              printf '%s\n' "$signing_output"
              exit 1
            fi

            if ! grep -Eiq \
              'Verified using v3 scheme.*: true' \
              <<< "$signing_output"; then
              echo "::error::APK is not verified with signature scheme V3: $filename"
              printf '%s\n' "$signing_output"
              exit 1
            fi

            certificate="$(
              printf '%s\n' "$signing_output" |
                sed -nE \
                  's/.*certificate SHA-256 digest:[[:space:]]*//Ip' |
                head -n 1 |
                tr -cd '[:xdigit:]' |
                tr '[:upper:]' '[:lower:]' || true
            )"

            if [[ ! "$certificate" =~ ^[a-f0-9]{64}$ ]]; then
              echo "::error::Could not extract a valid SHA-256 certificate: $filename"
              echo "::group::apksigner output"
              printf '%s\n' "$signing_output"
              echo "::endgroup::"
              exit 1
            fi

            if [[ -z "$reference_certificate" ]]; then
              reference_certificate="$certificate"
            elif [[ "$certificate" != "$reference_certificate" ]]; then
              echo "::error::Signing certificate mismatch: $filename"
              exit 1
            fi

            "$tools/aapt" dump badging "$source" > badging.txt

            grep -Fq "package: name='vn.kozu'" badging.txt || {
              echo "::error::Incorrect applicationId: $filename"
              exit 1
            }

            tr -d '\r' < badging.txt |
              grep -Fq "versionName='$expected_version'" || {
              echo "::error::APK versionName does not match release tag $expected_version: $filename"
              exit 1
            }

            tr -d '\r' < badging.txt |
              grep -Fq "versionCode='$EXPECTED_VERSION_CODE'" || {
              echo "::error::APK versionCode does not match version $expected_version (expected $EXPECTED_VERSION_CODE): $filename"
              exit 1
            }

            tr -d '\r' < badging.txt |
              grep -Fqx "sdkVersion:'28'" || {
              echo "::error::Unexpected or missing minimum SDK in $filename"
              exit 1
            }

            native_code="$(
              sed -n 's/^native-code: //p' badging.txt
            )"

            if [[ "$label" == "universal" ]]; then
              for abi in arm64-v8a armeabi-v7a x86 x86_64; do
                [[ "$native_code" == *"'$abi'"* ]] || {
                  echo "::error::Universal APK is missing $abi"
                  exit 1
                }
              done
            else
              [[ "$native_code" == *"'$label'"* ]] || {
                echo "::error::APK is missing native libraries for $label"
                exit 1
              }
            fi

            cp "$source" "$destination"

            echo "Verified: $filename -> $release_filename"
          done

          echo "All APKs passed verification."

      - name: Upload APK to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r asset; do
            case "$asset" in
              app-arm64-v8a-release.apk|app-armeabi-v7a-release.apk|app-universal-release.apk|app-x86-release.apk|app-x86_64-release.apk)
                gh release delete-asset "$TAG" "$asset" --yes
                ;;
            esac
          done < <(gh release view "$TAG" --json assets --jq '.assets[].name')

          gh release upload "$TAG" \
            dist/kozu-arm64-v8a.apk \
            dist/kozu-armeabi-v7a.apk \
            dist/kozu-universal.apk \
            dist/kozu-x86.apk \
            dist/kozu-x86_64.apk \
            --clobber

      - name: Upload test APK artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: release-test-${{ steps.version.outputs.version }}-${{ github.run_id }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 3

      - name: Verify APK
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          gh release view "$TAG" --json assets > release-assets.json

          python3 - <<'PY'
          import json

          expected = {
              "kozu-arm64-v8a.apk",
              "kozu-armeabi-v7a.apk",
              "kozu-universal.apk",
              "kozu-x86.apk",
              "kozu-x86_64.apk",
          }

          with open("release-assets.json", encoding="utf-8") as file:
              release = json.load(file)

          actual = {
              asset["name"]
              for asset in release.get("assets", [])
              if asset["name"].lower().endswith(".apk")
          }

          missing = sorted(expected - actual)
          unexpected = sorted(actual - expected)

          if missing or unexpected:
              if missing:
                  print("Missing APK assets: " + ", ".join(missing))
              if unexpected:
                  print("Unexpected APK assets: " + ", ".join(unexpected))
              raise SystemExit(1)

          print("Release contains exactly the five expected APK assets.")
          PY

      - name: Generate download table at end of release description
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          gh release view "$TAG" \
            --json assets,body,isPrerelease > release.json

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.parse import quote

          with open("release.json", encoding="utf-8") as file:
              release = json.load(file)

          tag = os.environ["TAG"]
          repository = os.environ["REPOSITORY"]
          body = release.get("body") or ""

          existing_assets = {
              asset["name"] for asset in release.get("assets", [])
          }

          variants = [
              (
                  "kozu-arm64-v8a",
                  "kozu-arm64-v8a.apk",
                  "**Recommended:** Modern ARM64 phones (Pixel, Samsung, OnePlus, Xiaomi, etc.)",
              ),
              (
                  "kozu-armeabi-v7a",
                  "kozu-armeabi-v7a.apk",
                  "Older/budget 32-bit ARM phones",
              ),
              (
                  "kozu-universal",
                  "kozu-universal.apk",
                  "Includes all supported architectures",
              ),
              (
                  "kozu-x86",
                  "kozu-x86.apk",
                  "32-bit x86 emulators",
              ),
              (
                  "kozu-x86_64",
                  "kozu-x86_64.apk",
                  "64-bit x86 emulators and Chromebooks",
              ),
          ]

          missing = [
              filename
              for _, filename, _ in variants
              if filename not in existing_assets
          ]

          if missing:
              raise SystemExit(
                  "Missing release assets: " + ", ".join(missing)
              )

          start_marker = "<!-- KOZU_APK_DOWNLOADS_START -->"
          end_marker = "<!-- KOZU_APK_DOWNLOADS_END -->"

          lines = [
              start_marker,
              "## Downloads⬇️",
              "",
              "| APK | Devices |",
              "|---|---|",
          ]

          encoded_tag = quote(tag, safe="")

          for display_name, filename, target in variants:
              download_url = (
                  f"https://github.com/{repository}/releases/download/"
                  f"{encoded_tag}/{quote(filename, safe='')}"
              )

              lines.append(
                  f"| [`{display_name}`]({download_url}) | {target} |"
              )

          lines.append(end_marker)
          download_block = "\n".join(lines)

          has_start = start_marker in body
          has_end = end_marker in body

          if has_start != has_end:
              raise SystemExit(
                  "Incomplete Kozu download table markers."
              )

          if has_start:
              start = body.index(start_marker)
              end = body.index(end_marker, start) + len(end_marker)
              body = body[:start] + body[end:]

          original_body = body.strip()

          if original_body:
              updated_body = (
                  original_body
                  + "\n\n---\n\n"
                  + download_block
              )
          else:
              updated_body = download_block

          Path("release-notes.md").write_text(
              updated_body.rstrip() + "\n",
              encoding="utf-8",
          )

          release_kind = (
              "Pre-release"
              if release.get("isPrerelease")
              else "Release"
          )

          print(f"Updated APK table for {release_kind} {tag}.")
          print("Download table is at the end of the description.")
          PY

          gh release edit "$TAG" --notes-file release-notes.md
