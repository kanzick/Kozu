name: Release APK

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Release version (v7.2.7 or 7.2.7)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.version || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build release or test APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Determine version and checkout ref
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
          SELECTED_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "release" ]]; then
            raw_version="$RELEASE_TAG"
            checkout_ref="$RELEASE_TAG"
            release_tag="$RELEASE_TAG"
          else
            raw_version="$INPUT_VERSION"
            checkout_ref="$SELECTED_REF"
            release_tag=""
          fi

          [[ -n "$raw_version" ]] || { echo "::error::Version is empty."; exit 1; }

          normalized_version="${raw_version#[vV]}"
          if [[ ! "$normalized_version" =~ ^(0|[1-9][0-9]?)\.(0|[1-9][0-9]?)(\.(0|[1-9][0-9]?))?$ ]]; then
            echo "::error::Invalid version: $raw_version"
            exit 1
          fi

          {
            echo "tag=$release_tag"
            echo "version=$raw_version"
            echo "normalized_version=$normalized_version"
            echo "checkout_ref=$checkout_ref"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout selected branch or release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.version.outputs.checkout_ref }}
          fetch-depth: 0

      - name: Prepare Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Check release exists
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: gh release view "$TAG" >/dev/null

      - name: Set up Java 27
        uses: actions/setup-java@v6
        with:
          java-version: '27'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success

      - name: Validate and prepare signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for s in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [[ -n "${!s:-}" ]] || { echo "::error::Missing secret: $s"; exit 1; }
          done

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kozu-release.jks"
          test -s "$RUNNER_TEMP/kozu-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/kozu-release.jks" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null

      - name: Generate version code from version name
        id: version_code
        env:
          VERSION: ${{ steps.version.outputs.normalized_version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$VERSION" == *.*.* ]]; then
            IFS='.' read -r major minor patch <<< "$VERSION"
            patch_slot=$((10#$patch + 2))
          else
            IFS='.' read -r major minor <<< "$VERSION"
            patch_slot=1
          fi

          version_code=$(((10#$major * 100 + 10#$minor) * 101 + patch_slot))
          (( version_code >= 1 && version_code <= 2100000000 )) || { echo "::error::Invalid versionCode: $version_code"; exit 1; }
          echo "code=$version_code" >> "$GITHUB_OUTPUT"

      - name: Build Release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/kozu-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: ./gradlew clean :app:assembleRelease "-PAPP_VERSION_NAME=$RELEASE_VERSION" --stacktrace

      - name: Verify package APK
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          EXPECTED_VERSION_CODE: ${{ steps.version_code.outputs.code }}
        shell: bash
        run: |
          set -euo pipefail
          tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$tools/apksigner" && test -x "$tools/aapt"

          output="app/build/outputs/apk/release"
          mkdir -p dist

          variants=(
            "arm64-v8a:app-arm64-v8a-release.apk:kozu-arm64-v8a.apk"
            "armeabi-v7a:app-armeabi-v7a-release.apk:kozu-armeabi-v7a.apk"
            "universal:app-universal-release.apk:kozu-universal.apk"
            "x86:app-x86-release.apk:kozu-x86.apk"
            "x86_64:app-x86_64-release.apk:kozu-x86_64.apk"
          )

          expected_apks=(
            app-arm64-v8a-release.apk
            app-armeabi-v7a-release.apk
            app-universal-release.apk
            app-x86-release.apk
            app-x86_64-release.apk
          )
          mapfile -t actual_apks < <(find "$output" -maxdepth 1 -type f -name '*.apk' -printf '%f\n' | sort)

          diff -u <(printf '%s\n' "${expected_apks[@]}" | sort) <(printf '%s\n' "${actual_apks[@]}") || {
            echo "::error::Release build must produce exactly the five expected APKs."
            exit 1
          }

          reference_certificate=""
          for variant in "${variants[@]}"; do
            IFS=':' read -r label filename release_filename <<< "$variant"
            source="$output/$filename"

            unzip -tq "$source" >/dev/null || { echo "::error::Archive validation failed: $filename"; exit 1; }
            signing_output="$("$tools/apksigner" verify --verbose --print-certs "$source" 2>&1)" || { echo "::error::Signature verification failed: $filename"; exit 1; }
            grep -Eiq 'Verified using v3 scheme.*: true' <<< "$signing_output" || { echo "::error::Missing V3 signature: $filename"; exit 1; }

            certificate="$(printf '%s\n' "$signing_output" | sed -nE 's/.*certificate SHA-256 digest:[[:space:]]*//Ip' | head -n 1 | tr -cd '[:xdigit:]' | tr '[:upper:]' '[:lower:]')"
            [[ "$certificate" =~ ^[a-f0-9]{64}$ ]] || { echo "::error::Invalid SHA-256 certificate: $filename"; exit 1; }

            if [[ -z "$reference_certificate" ]]; then
              reference_certificate="$certificate"
            elif [[ "$certificate" != "$reference_certificate" ]]; then
              echo "::error::Signing certificate mismatch: $filename"
              exit 1
            fi

            "$tools/aapt" dump badging "$source" | tr -d '\r' > badging.txt
            grep -Fq "package: name='vn.kozu'" badging.txt || { echo "::error::Incorrect applicationId: $filename"; exit 1; }
            grep -Fq "versionName='$RELEASE_VERSION'" badging.txt || { echo "::error::VersionName mismatch: $filename"; exit 1; }
            grep -Fq "versionCode='$EXPECTED_VERSION_CODE'" badging.txt || { echo "::error::VersionCode mismatch: $filename"; exit 1; }
            grep -Fqx "sdkVersion:'28'" badging.txt || { echo "::error::Minimum SDK mismatch: $filename"; exit 1; }

            native_code="$(sed -n 's/^native-code: //p' badging.txt)"
            if [[ "$label" == "universal" ]]; then
              for abi in arm64-v8a armeabi-v7a x86 x86_64; do
                [[ "$native_code" == *"'$abi'"* ]] || { echo "::error::Universal APK missing $abi"; exit 1; }
              done
            else
              [[ "$native_code" == *"'$label'"* ]] || { echo "::error::APK missing $label"; exit 1; }
            fi

            cp "$source" "dist/$release_filename"
          done

      - name: Upload APK to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r asset; do
            case "$asset" in
              app-arm64-v8a-release.apk|app-armeabi-v7a-release.apk|app-universal-release.apk|app-x86-release.apk|app-x86_64-release.apk)
                gh release delete-asset "$TAG" "$asset" --yes ;;
            esac
          done < <(gh release view "$TAG" --json assets --jq '.assets[].name')

          gh release upload "$TAG" dist/*.apk --clobber

      - name: Upload test APK artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: release-test-${{ steps.version.outputs.version }}-${{ github.run_id }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 3

      - name: Verify and generate download table
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" --json assets,body > release.json

          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from urllib.parse import quote

          release = json.loads(Path("release.json").read_text(encoding="utf-8"))
          tag, repo = os.environ["TAG"], os.environ["REPOSITORY"]
          body = release.get("body") or ""

          variants = [
              ("kozu-arm64-v8a", "kozu-arm64-v8a.apk", "**Recommended:** Modern ARM64 phones (Pixel, Samsung, OnePlus, Xiaomi, etc.)"),
              ("kozu-armeabi-v7a", "kozu-armeabi-v7a.apk", "Older/budget 32-bit ARM phones"),
              ("kozu-universal", "kozu-universal.apk", "Includes all supported architectures"),
              ("kozu-x86", "kozu-x86.apk", "32-bit x86 emulators"),
              ("kozu-x86_64", "kozu-x86_64.apk", "64-bit x86 emulators and Chromebooks"),
          ]

          expected = {f for _, f, _ in variants}
          actual = {a["name"] for a in release.get("assets", []) if a["name"].lower().endswith(".apk")}
          if expected != actual:
              raise SystemExit(f"APK assets mismatch. Missing: {sorted(expected - actual)}, Unexpected: {sorted(actual - expected)}")

          header = "## Downloads⬇️"
          encoded_tag = quote(tag, safe="")
          rows = [f"| [`{name}`](https://github.com{repo}/releases/download/{encoded_tag}/{quote(file, safe='')}) | {desc} |" for name, file, desc in variants]
          table = "\n".join([header, "", "| APK | Devices |", "|---|---|", *rows])

          if header in body:
              body = body[:body.index(header)].rstrip()
              if body.endswith("---"):
                  body = body[:-3].rstrip()

          original = body.strip()
          updated = f"{original}\n\n---\n\n{table}" if original else table
          Path("release-notes.md").write_text(updated + "\n", encoding="utf-8")
          PY

          gh release edit "$TAG" --notes-file release-notes.md


