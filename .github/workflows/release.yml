name: Release APK

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (7.2.7)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and upload APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag || github.ref }}
          fetch-depth: 0

      - name: Prepare Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Determine release tag
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          REF_NAME: ${{ github.ref_name }}
          GITHUB_REF_VALUE: ${{ github.ref }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "release" ]]; then
            tag="$RELEASE_TAG"
          elif [[ -n "$INPUT_RELEASE_TAG" ]]; then
            tag="$INPUT_RELEASE_TAG"
          elif [[ "$GITHUB_REF_VALUE" == refs/tags/* ]]; then
            tag="$REF_NAME"
          else
            echo "::error::A release tag is required."
            exit 1
          fi

          version="${tag#v}"

          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || {
            echo "::error::Invalid release tag: $tag"
            exit 1
          }

          echo "Release tag: $tag"
          echo "Tag version: $version"
          echo "No Gradle versionName comparison will be performed."

          {
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Check release exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release '$TAG' does not exist. Create and publish it first."
            exit 1
          fi

      - name: Check existing APKs
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          gh release view "$TAG" --json assets > release-assets.json

          if python3 - <<'PY'
          import json

          required = {
              "app-universal-release.apk",
              "app-arm64-v8a-release.apk",
              "app-armeabi-v7a-release.apk",
              "app-x86-release.apk",
              "app-x86_64-release.apk",
          }

          with open("release-assets.json", encoding="utf-8") as file:
              data = json.load(file)

          existing = {asset["name"] for asset in data.get("assets", [])}
          missing = required - existing

          if missing:
              print("Missing APKs:", ", ".join(sorted(missing)))
              raise SystemExit(1)

          print("All APK variants already exist; skipping the build.")
          PY
          then
            echo "has_all=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_all=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Java 27
        if: ${{ steps.existing.outputs.has_all != 'true' }}
        uses: actions/setup-java@v6
        with:
          java-version: '27'
          distribution: temurin

      - name: Set up Gradle
        if: ${{ steps.existing.outputs.has_all != 'true' }}
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success

      - name: Validate signing secrets
        if: ${{ steps.existing.outputs.has_all != 'true' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          for secret_name in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD; do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "::error::Missing secret: $secret_name"
              exit 1
            fi
          done

      - name: Prepare release keystore
        if: ${{ steps.existing.outputs.has_all != 'true' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" |
            base64 --decode > "$RUNNER_TEMP/kozu-release.jks"
          test -s "$RUNNER_TEMP/kozu-release.jks"

      - name: Build Release APKs
        if: ${{ steps.existing.outputs.has_all != 'true' }}
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/kozu-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:assembleRelease --stacktrace

      - name: Verify and package APKs
        if: ${{ steps.existing.outputs.has_all != 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          tools="$(find "$ANDROID_HOME/build-tools" \
            -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"

          test -x "$tools/apksigner"
          test -x "$tools/aapt2"

          output="app/build/outputs/apk/release"
          mkdir -p dist

          variants=(
            "universal:app-universal-release.apk"
            "arm64-v8a:app-arm64-v8a-release.apk"
            "armeabi-v7a:app-armeabi-v7a-release.apk"
            "x86:app-x86-release.apk"
            "x86_64:app-x86_64-release.apk"
          )

          for variant in "${variants[@]}"; do
            label="${variant%%:*}"
            source="$output/${variant#*:}"
            destination="dist/app-${label}-release.apk"

            if [[ ! -f "$source" ]]; then
              echo "::error::Missing APK: $source"
              find app/build/outputs/apk -maxdepth 5 -type f -print || true
              exit 1
            fi

            "$tools/apksigner" verify --verbose --print-certs "$source"
            "$tools/aapt2" dump badging "$source" > badging.txt

            grep -Fq "package: name='vn.kozu'" badging.txt || {
              echo "::error::Incorrect applicationId in $source"
              exit 1
            }

            native_code="$(sed -n 's/^native-code: //p' badging.txt)"

            if [[ "$label" == "universal" ]]; then
              for abi in arm64-v8a armeabi-v7a x86 x86_64; do
                [[ "$native_code" == *"'$abi'"* ]] || {
                  echo "::error::Universal APK is missing $abi"
                  exit 1
                }
              done
            else
              [[ "$native_code" == *"'$label'"* ]] || {
                echo "::error::APK is missing native libraries for $label"
                exit 1
              }
            fi

            signing_output="$("$tools/apksigner" verify --verbose "$source")"
            grep -Fq \
              "Verified using v2 scheme (APK Signature Scheme v2): true" \
              <<< "$signing_output" || {
                echo "::error::APK v2 signature verification failed: $source"
                exit 1
              }

            cp "$source" "$destination"
          done

      - name: Upload APKs to release
        if: ${{ steps.existing.outputs.has_all != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$TAG" dist/*.apk --clobber
          echo "APK upload completed for release $TAG."

      - name: Generate download table and preserve release description
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          gh release view "$TAG" --json assets,body,isPrerelease > release.json

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.parse import quote

          with open("release.json", encoding="utf-8") as file:
              release = json.load(file)

          tag = os.environ["TAG"]
          repository = os.environ["REPOSITORY"]
          body = release.get("body") or ""
          existing_assets = {
              asset["name"] for asset in release.get("assets", [])
          }

          variants = [
              (
                  "app-arm64-v8a-release.apk",
                  "**Recommended:** Modern ARM64 phones (Pixel, Samsung, OnePlus, Xiaomi, etc.)",
              ),
              (
                  "app-universal-release.apk",
                  "Universal — works on devices with supported Android ABIs",
              ),
              (
                  "app-armeabi-v7a-release.apk",
                  "Older / budget 32-bit ARM phones",
              ),
              (
                  "app-x86-release.apk",
                  "32-bit x86 emulators and older Intel devices",
              ),
              (
                  "app-x86_64-release.apk",
                  "Emulators and Chromebooks (64-bit x86)",
              ),
          ]

          missing = [name for name, _ in variants if name not in existing_assets]
          if missing:
              raise SystemExit(
                  "Cannot generate the download table; missing release assets: "
                  + ", ".join(missing)
              )

          start_marker = "<!-- KOZU_APK_DOWNLOADS_START -->"
          end_marker = "<!-- KOZU_APK_DOWNLOADS_END -->"

          lines = [
              start_marker,
              "## Downloads",
              "",
              "| APK | Architecture / Target |",
              "|---|---|",
          ]

          encoded_tag = quote(tag, safe="")
          for filename, target in variants:
              download_url = (
                  f"https://github.com/{repository}/releases/download/"
                  f"{encoded_tag}/{quote(filename, safe='')}"
              )
              lines.append(f"| [`{filename}`]({download_url}) | {target} |")

          lines.append(end_marker)
          download_block = "\n".join(lines)

          has_start = start_marker in body
          has_end = end_marker in body
          if has_start != has_end:
              raise SystemExit(
                  "Release description contains only one Kozu table marker; "
                  "refusing to overwrite the description."
              )

          if has_start:
              start = body.index(start_marker)
              end = body.index(end_marker, start) + len(end_marker)
              updated_body = body[:start] + download_block + body[end:]
          else:
              # Put the generated table first and preserve the original
              # release description/changelog below it.
              updated_body = download_block
              if body.strip():
                  updated_body += "\n\n---\n\n" + body.strip()

          Path("release-notes.md").write_text(
              updated_body.rstrip() + "\n",
              encoding="utf-8",
          )

          release_kind = "Pre-release" if release.get("isPrerelease") else "Release"
          print(f"Updated the APK download table for {release_kind} {tag}.")
          print("The existing release description was preserved below the table.")
          PY

          gh release edit "$TAG" --notes-file release-notes.md
