name: Release APK

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag (for example 0.1.1 or 0.1.1-beta.1)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and upload APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}
          fetch-depth: 0

      - name: Prepare Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Determine release tag
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "release" ]]; then
            tag="$RELEASE_TAG"
          else
            tag="$INPUT_RELEASE_TAG"
          fi

          tag_version="${tag#v}"
          if [[ ! "$tag_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release tag: $tag"
            exit 1
          fi

          if [[ -z "$tag" ]]; then
            echo "::error::Release tag is empty."
            exit 1
          fi

          echo "Release tag: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check release exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null

      - name: Set up Java 27
        uses: actions/setup-java@v6
        with:
          java-version: '27'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success

      - name: Validate signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          for secret_name in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD; do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "::error::Missing secret: $secret_name"
              exit 1
            fi
          done

      - name: Prepare release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail

          printf '%s' "$ANDROID_KEYSTORE_BASE64" |
            base64 --decode > "$RUNNER_TEMP/kozu-release.jks"

          test -s "$RUNNER_TEMP/kozu-release.jks"

          keytool -list \
            -keystore "$RUNNER_TEMP/kozu-release.jks" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null

      - name: Build Release APKs
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/kozu-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew clean :app:assembleRelease --stacktrace

      - name: Verify and package APKs
        shell: bash
        run: |
          set -euo pipefail

          tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$tools/apksigner"
          test -x "$tools/aapt2"

          output="app/build/outputs/apk/release"
          mkdir -p dist

          variants=(
            "arm64-v8a:app-arm64-v8a-release.apk"
            "armeabi-v7a:app-armeabi-v7a-release.apk"
            "universal:app-universal-release.apk"
            "x86:app-x86-release.apk"
            "x86_64:app-x86_64-release.apk"
          )

          reference_certificate=""

          for variant in "${variants[@]}"; do
            label="${variant%%:*}"
            filename="${variant#*:}"
            source="$output/$filename"
            destination="dist/$filename"

            if [[ ! -f "$source" ]]; then
              echo "::error::Missing APK: $source"
              find app/build/outputs/apk -maxdepth 5 -type f -print || true
              exit 1
            fi

            signing_output="$("$tools/apksigner" verify --verbose --print-certs "$source" 2>&1)" || {
              echo "::error::APK signature verification failed: $filename"
              printf '%s\n' "$signing_output"
              exit 1
            }

            grep -Fq "Verified using v2 scheme (APK Signature Scheme v2): true" <<< "$signing_output" || {
              echo "::error::APK is not signed with APK Signature Scheme v2: $filename"
              printf '%s\n' "$signing_output"
              exit 1
            }

            certificate="$(awk -F': ' '/Signer #1 certificate SHA-256 digest:/ { print $2; exit }' <<< "$signing_output")"
            if [[ -z "$certificate" ]]; then
              echo "::error::Could not read the signing certificate from $filename"
              exit 1
            fi

            if [[ -z "$reference_certificate" ]]; then
              reference_certificate="$certificate"
            elif [[ "$certificate" != "$reference_certificate" ]]; then
              echo "::error::Signing certificate mismatch in $filename"
              exit 1
            fi

            "$tools/aapt2" dump badging "$source" > badging.txt

            grep -Fq "package: name='vn.kozu'" badging.txt || {
              echo "::error::Incorrect applicationId in $filename"
              exit 1
            }

            native_code="$(sed -n 's/^native-code: //p' badging.txt)"

            if [[ "$label" == "universal" ]]; then
              for abi in arm64-v8a armeabi-v7a x86 x86_64; do
                [[ "$native_code" == *"'$abi'"* ]] || {
                  echo "::error::Universal APK is missing $abi"
                  exit 1
                }
              done
            else
              [[ "$native_code" == *"'$label'"* ]] || {
                echo "::error::APK is missing native libraries for $label"
                exit 1
              }
            fi

            cp "$source" "$destination"
          done

      - name: Upload APKs to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$TAG" \
            dist/app-arm64-v8a-release.apk \
            dist/app-armeabi-v7a-release.apk \
            dist/app-universal-release.apk \
            dist/app-x86-release.apk \
            dist/app-x86_64-release.apk \
            --clobber

      - name: Generate download table at end of release description
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" --json assets,body,isPrerelease > release.json

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.parse import quote

          with open("release.json", encoding="utf-8") as file:
              release = json.load(file)

          tag = os.environ["TAG"]
          repository = os.environ["REPOSITORY"]
          body = release.get("body") or ""
          existing_assets = {
              asset["name"] for asset in release.get("assets", [])
          }

          variants = [
              (
                  "app-arm64-v8a-release.apk",
                  "**Recommended:** Modern ARM64 phones (Pixel, Samsung, OnePlus, Xiaomi, etc.)",
              ),
              (
                  "app-armeabi-v7a-release.apk",
                  "Older / budget 32-bit ARM phones",
              ),
              (
                  "app-universal-release.apk",
                  "Universal — includes all supported architectures",
              ),
              (
                  "app-x86-release.apk",
                  "32-bit x86 emulators",
              ),
              (
                  "app-x86_64-release.apk",
                  "64-bit x86 emulators and Chromebooks",
              ),
          ]

          missing = [
              filename
              for filename, _ in variants
              if filename not in existing_assets
          ]
          if missing:
              raise SystemExit(
                  "Cannot generate the download table; missing release assets: "
                  + ", ".join(missing)
              )

          start_marker = "<!-- KOZU_APK_DOWNLOADS_START -->"
          end_marker = "<!-- KOZU_APK_DOWNLOADS_END -->"

          lines = [
              start_marker,
              "## Downloads",
              "",
              "| APK | Architecture / Target |",
              "|---|---|",
          ]

          encoded_tag = quote(tag, safe="")
          for filename, target in variants:
              download_url = (
                  f"https://github.com/{repository}/releases/download/"
                  f"{encoded_tag}/{quote(filename, safe='')}"
              )
              lines.append(f"| [`{filename}`]({download_url}) | {target} |")

          lines.append(end_marker)
          download_block = "\n".join(lines)

          has_start = start_marker in body
          has_end = end_marker in body
          if has_start != has_end:
              raise SystemExit(
                  "Release description contains an incomplete Kozu download table."
              )

          if has_start:
              start = body.index(start_marker)
              end = body.index(end_marker, start) + len(end_marker)
              body = body[:start] + body[end:]

          original_body = body.strip()
          if original_body:
              updated_body = original_body + "\n\n---\n\n" + download_block
          else:
              updated_body = download_block

          Path("release-notes.md").write_text(
              updated_body.rstrip() + "\n",
              encoding="utf-8",
          )

          release_kind = "Pre-release" if release.get("isPrerelease") else "Release"
          print(f"Updated the APK table for {release_kind} {tag}.")
          print("The download table is at the end of the release description.")
          PY

          gh release edit "$TAG" --notes-file release-notes.md
