
name: Release Android APK

on:
  push:
    branches:
      - main
    paths:
      - app/build.gradle.kts
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Create as a pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout full Git history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prepare Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Determine release version and versionCode
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_VALUE: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_IS_PRERELEASE: ${{ github.event.release.prerelease }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail

          extract_gradle_version() {
            python3 -c '
          import re, sys
          text = sys.stdin.read()
          match = re.search(r"versionName\s*=\s*\"([^\"]+)\"", text)
          if not match:
              raise SystemExit("Could not find literal versionName = \"...\" in app/build.gradle.kts")
          print(match.group(1))
          '
          }

          gradle_version="$(extract_gradle_version < app/build.gradle.kts)"
          skip="false"
          tag=""
          version=""

          if [[ "$EVENT_NAME" == "release" ]]; then
            tag="$RELEASE_TAG"
            version="${tag#v}"
          elif [[ "$EVENT_NAME" == "push" && "$GITHUB_REF_VALUE" == refs/tags/* ]]; then
            tag="$REF_NAME"
            version="${tag#v}"
          else
            version="$gradle_version"
            tag="v$version"
          fi

          if [[ "$tag" != "v$version" ]]; then
            echo "::error::Release tag must use the v<version> format; got '$tag'."
            exit 1
          fi

          if [[ "$version" != "$gradle_version" ]]; then
            echo "::error::Release tag/version '$version' does not match app/build.gradle.kts versionName '$gradle_version'. Update versionName first, then publish the matching tag."
            exit 1
          fi

          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || {
            echo "::error::Version '$version' must use MAJOR.MINOR.PATCH format, optionally followed by a pre-release suffix."
            exit 1
          }

          if [[ "$EVENT_NAME" == "push" && "$GITHUB_REF_VALUE" == "refs/heads/main" ]]; then
            old_version=""
            if git cat-file -e HEAD^:app/build.gradle.kts 2>/dev/null; then
              old_version="$(git show HEAD^:app/build.gradle.kts | extract_gradle_version || true)"
            fi

            if [[ -n "$old_version" && "$old_version" == "$version" ]]; then
              echo "Gradle version did not change; skipping release."
              skip="true"
            elif git rev-parse "$tag" >/dev/null 2>&1; then
              echo "Tag $tag already exists; skipping automatic release."
              skip="true"
            fi
          fi

          from_ref="$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || true)"
          if [[ -z "$from_ref" ]]; then
            from_ref="$(git rev-list --max-parents=0 HEAD | tail -n 1)"
          fi
          to_ref="$(git rev-parse HEAD)"

          code="$(git rev-list --count HEAD)"
          if [[ ! "$code" =~ ^[1-9][0-9]*$ ]] || (( code > 2100000000 )); then
            echo "::error::Generated versionCode is outside Android's valid range: $code"
            exit 1
          fi

          prerelease="false"
          if [[ "$EVENT_NAME" == "release" && "$RELEASE_IS_PRERELEASE" == "true" ]]; then
            prerelease="true"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$INPUT_PRERELEASE" == "true" ]]; then
            prerelease="true"
          elif [[ "$version" == *-* ]]; then
            prerelease="true"
          fi

          echo "Release version: $version"
          echo "Release tag: $tag"
          echo "Commit-derived versionCode: $code"

          {
            echo "name=$version"
            echo "exact_tag=$tag"
            echo "code=$code"
            echo "prerelease=$prerelease"
            echo "skip=$skip"
            echo "from_ref=$from_ref"
            echo "to_ref=$to_ref"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Java 27
        if: ${{ steps.version.outputs.skip != 'true' }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '27'

      - name: Set up Gradle
        if: ${{ steps.version.outputs.skip != 'true' }}
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success

      - name: Validate signing secrets
        if: ${{ steps.version.outputs.skip != 'true' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for secret_name in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD; do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "::error::Missing required GitHub Actions secret: $secret_name"
              exit 1
            fi
          done

      - name: Prepare release keystore
        if: ${{ steps.version.outputs.skip != 'true' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import base64, os, pathlib; pathlib.Path(os.environ["RUNNER_TEMP"], "kozu-release.jks").write_bytes(base64.b64decode(os.environ["ANDROID_KEYSTORE_BASE64"], validate=True))'

      - name: Build signed Release APKs
        if: ${{ steps.version.outputs.skip != 'true' }}
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/kozu-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APP_VERSION_CODE: ${{ steps.version.outputs.code }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:assembleRelease --stacktrace \
            "-PappVersionCode=$APP_VERSION_CODE"

      - name: Verify and package APK variants
        if: ${{ steps.version.outputs.skip != 'true' }}
        env:
          RELEASE_VERSION_NAME: ${{ steps.version.outputs.name }}
        shell: bash
        run: |
          set -euo pipefail
          tools="$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)"
          test -x "$tools/apksigner" || { echo "::error::Could not find apksigner under $tools"; exit 1; }
          test -x "$tools/aapt2" || { echo "::error::Could not find aapt2 under $tools"; exit 1; }

          output="app/build/outputs/apk/release"
          mkdir -p dist
          variants=(
            "universal:app-universal-release.apk"
            "arm64-v8a:app-arm64-v8a-release.apk"
            "armeabi-v7a:app-armeabi-v7a-release.apk"
            "x86:app-x86-release.apk"
            "x86_64:app-x86_64-release.apk"
          )

          for variant in "${variants[@]}"; do
            label="${variant%%:*}"
            source="$output/${variant#*:}"
            destination="dist/app-${label}.apk"

            if [[ ! -f "$source" ]]; then
              echo "::error::Missing APK variant: $source"
              find app/build/outputs/apk -maxdepth 5 -type f -print || true
              exit 1
            fi

            "$tools/apksigner" verify --verbose --print-certs "$source"
            "$tools/aapt2" dump badging "$source" > badging.txt

            grep -q "package: name='vn.kozu'" badging.txt || {
              echo "::error::Unexpected package name in $source"
              exit 1
            }
            grep -Fq "versionName='${RELEASE_VERSION_NAME}'" badging.txt || {
              echo "::error::versionName mismatch in $source"
              exit 1
            }

            native_code="$(sed -n 's/^native-code: //p' badging.txt)"
            if [[ "$label" == "universal" ]]; then
              for abi in arm64-v8a armeabi-v7a x86 x86_64; do
                [[ "$native_code" == *"'$abi'"* ]] || {
                  echo "::error::Universal APK is missing native libraries for $abi"
                  exit 1
                }
              done
            else
              [[ "$native_code" == *"'$label'"* ]] || {
                echo "::error::APK does not contain native libraries for $label"
                exit 1
              }
            fi

            "$tools/apksigner" verify --verbose "$source" | grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" || {
              echo "::error::APK is not v2-signed: $source"
              exit 1
            }

            cp "$source" "$destination"
          done

      - name: Create version tag after version change
        if: ${{ steps.version.outputs.skip != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          TAG: ${{ steps.version.outputs.exact_tag }}
        shell: bash
        run: |
          set -euo pipefail
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Generate categorized changelog
        id: changelog
        if: ${{ steps.version.outputs.skip != 'true' && github.event_name != 'release' }}
        uses: mikepenz/release-changelog-builder-action@v6
        with:
          mode: "COMMIT"
          fromTag: ${{ steps.version.outputs.from_ref }}
          toTag: ${{ steps.version.outputs.to_ref }}
          configurationJson: |
            {
              "template": "#{{CHANGELOG}}\n\n<details>\n<summary>Other changes</summary>\n\n#{{UNCATEGORIZED}}\n</details>\n",
              "pr_template": "- #{{TITLE}} — by @#{{AUTHOR}}",
              "categories": [
                { "title": "## ✨ Features", "labels": ["feat", "feature"] },
                { "title": "## 🐛 Fixes", "labels": ["fix", "bug"] },
                { "title": "## ⚡ Performance", "labels": ["perf", "performance"] },
                { "title": "## 🎨 UI / UX", "labels": ["ui", "ux", "design", "style"] },
                { "title": "## 🎵 Playback & Audio", "labels": ["playback", "audio", "music", "player"] },
                { "title": "## 🔎 Search & Discovery", "labels": ["search", "browse", "discover"] },
                { "title": "## ♻️ Refactors", "labels": ["refactor"] },
                { "title": "## 📚 Documentation", "labels": ["docs", "documentation"] },
                { "title": "## 🛠️ Build / CI", "labels": ["build", "ci", "chore"] },
                { "title": "## ✅ Tests", "labels": ["test", "tests"] }
              ],
              "label_extractor": [
                {
                  "pattern": "^(build|chore|ci|docs|documentation|feat|feature|fix|bug|perf|performance|refactor|revert|style|test|tests|ui|ux|design|playback|audio|music|player|search|browse|discover){1}(\\([\\w\\-\\.]+\\))?(!)?:\\s+.*$",
                  "on_property": "title",
                  "target": "$1"
                }
              ]
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compose rich release description
        id: release-description
        if: ${{ steps.version.outputs.skip != 'true' && github.event_name != 'release' }}
        env:
          VERSION: ${{ steps.version.outputs.name }}
          TAG: ${{ steps.version.outputs.exact_tag }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          CHANGELOG: ${{ steps.changelog.outputs.changelog }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ steps.version.outputs.to_ref }}
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PYNOTES'
          import os
          from pathlib import Path
          import textwrap

          version = os.environ["VERSION"]
          tag = os.environ["TAG"]
          repo = os.environ["REPOSITORY"]
          sha = os.environ["COMMIT_SHA"]
          changelog = os.environ.get("CHANGELOG", "").strip()
          base = f"https://github.com/{repo}/releases/download/{tag}"

          body = textwrap.dedent(f"""
          # Kozu {version}

          Kozu release **{version}**. Review the categorized changes below and choose the APK that matches your device.

          ## 📦 Downloads

          | Package | Download |
          | --- | --- |
          | Universal | [Download APK]({base}/app-universal.apk) |
          | ARM 64-bit | [Download APK]({base}/app-arm64-v8a.apk) |
          | ARM 32-bit | [Download APK]({base}/app-armeabi-v7a.apk) |
          | x86 64-bit | [Download APK]({base}/app-x86_64.apk) |
          | x86 32-bit | [Download APK]({base}/app-x86.apk) |

          ## 📝 What's changed

          {changelog if changelog else "- No categorized commit messages were found for this release. See the commit history for details."}

          ## 🔧 Build information

          - **Version:** `{version}`
          - **Version code:** `{os.environ['VERSION_CODE']}`
          - **R8 optimization:** Enabled (R8 and resource shrinking)
          - **Source commit:** [`{sha[:7]}`](https://github.com/{repo}/commit/{sha})

          ---
          *Built automatically by GitHub Actions. If you encounter an issue, please report it in the Kozu repository.*
          """).strip()

          Path("release_notes.md").write_text(body + "\n", encoding="utf-8")
          PYNOTES

      - name: Create published release if missing
        if: ${{ steps.version.outputs.skip != 'true' && github.event_name != 'release' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.exact_tag }}
          VERSION: ${{ steps.version.outputs.name }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          TARGET_SHA: ${{ steps.version.outputs.to_ref }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            args=("$TAG" --target "$TARGET_SHA" --title "$VERSION" --notes-file release_notes.md)
            if [[ "$PRERELEASE" == "true" ]]; then
              args+=(--prerelease)
            fi
            gh release create "${args[@]}" dist/*.apk
          else
            echo "Release $TAG already exists; preserving its description."
          fi

      - name: Upload APK assets without changing release notes
        if: ${{ steps.version.outputs.skip != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.exact_tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$TAG" dist/*.apk --clobber
