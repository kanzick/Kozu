
name: Release APK

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g 7.2.7)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and upload APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prepare Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Determine release version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          REF_NAME: ${{ github.ref_name }}
          GITHUB_REF_VALUE: ${{ github.ref }}
        run: |
          set -euo pipefail

          gradle_version="$(python3 -c '
          import re
          from pathlib import Path

          content = Path("app/build.gradle.kts").read_text(
              encoding="utf-8-sig"
          )
          match = re.search(
              r"versionName\s*=\s*\"([^\"]+)\"",
              content
          )
          if not match:
              raise SystemExit(
                  "Cannot find versionName in app/build.gradle.kts"
              )
          print(match.group(1))
          ')"

          if [[ "$EVENT_NAME" == "release" ]]; then
            tag="$RELEASE_TAG"
          elif [[ -n "$INPUT_RELEASE_TAG" ]]; then
            tag="$INPUT_RELEASE_TAG"
          elif [[ "$GITHUB_REF_VALUE" == refs/tags/* ]]; then
            tag="$REF_NAME"
          else
            tag="$gradle_version"
          fi

          version="${tag#v}"

          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || {
            echo "::error::Invalid release tag: $tag"
            exit 1
          }

          if [[ "$version" != "$gradle_version" ]]; then
            echo "::error::Release tag version '$version' does not match Gradle versionName '$gradle_version'."
            exit 1
          fi

          echo "Release tag: $tag"
          echo "Version: $version"

          {
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Check release exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release '$TAG' does not exist. Create and publish the release first."
            exit 1
          fi

      - name: Check existing APKs
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          gh release view "$TAG" --json assets > release-assets.json

          if python3 - <<'PY'
          import json

          required = {
              "app-universal.apk",
              "app-arm64-v8a.apk",
              "app-armeabi-v7a.apk",
              "app-x86.apk",
              "app-x86_64.apk",
          }

          with open("release-assets.json", encoding="utf-8") as f:
              data = json.load(f)

          existing = {asset["name"] for asset in data.get("assets", [])}
          missing = required - existing

          if missing:
              print("Missing APKs:", ", ".join(sorted(missing)))
              raise SystemExit(1)

          print("All APK variants already exist.")
          PY
          then
            echo "has_all=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_all=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Java 27
        if: ${{ steps.existing.outputs.has_all != 'true' }}
        uses: actions/setup-java@v6
        with:
          java-version: '27'
          distribution: temurin

      - name: Set up Gradle
        if: ${{ steps.existing.outputs.has_all != 'true' }}
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success

      - name: Validate signing secrets
        if: ${{ steps.existing.outputs.has_all != 'true' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          for secret_name in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD; do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "::error::Missing secret: $secret_name"
              exit 1
            fi
          done

      - name: Prepare release keystore
        if: ${{ steps.existing.outputs.has_all != 'true' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" |
            base64 --decode > "$RUNNER_TEMP/kozu-release.jks"

      - name: Build Release APKs
        if: ${{ steps.existing.outputs.has_all != 'true' }}
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/kozu-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:assembleRelease --stacktrace

      - name: Verify and package APKs
        if: ${{ steps.existing.outputs.has_all != 'true' }}
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          tools="$(find "$ANDROID_HOME/build-tools" \
            -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"

          test -x "$tools/apksigner"
          test -x "$tools/aapt2"

          output="app/build/outputs/apk/release"
          mkdir -p dist

          variants=(
            "universal:app-universal-release.apk"
            "arm64-v8a:app-arm64-v8a-release.apk"
            "armeabi-v7a:app-armeabi-v7a-release.apk"
            "x86:app-x86-release.apk"
            "x86_64:app-x86_64-release.apk"
          )

          for variant in "${variants[@]}"; do
            label="${variant%%:*}"
            source="$output/${variant#*:}"
            destination="dist/app-${label}.apk"

            if [[ ! -f "$source" ]]; then
              echo "::error::Missing APK: $source"
              find app/build/outputs/apk -maxdepth 5 -type f -print || true
              exit 1
            fi

            "$tools/apksigner" verify --verbose --print-certs "$source"
            "$tools/aapt2" dump badging "$source" > badging.txt

            grep -Fq "package: name='vn.kozu'" badging.txt || {
              echo "::error::Incorrect applicationId in $source"
              exit 1
            }

            grep -Fq "versionName='${RELEASE_VERSION}'" badging.txt || {
              echo "::error::Incorrect versionName in $source"
              exit 1
            }

            native_code="$(sed -n 's/^native-code: //p' badging.txt)"

            if [[ "$label" == "universal" ]]; then
              for abi in arm64-v8a armeabi-v7a x86 x86_64; do
                [[ "$native_code" == *"'$abi'"* ]] || {
                  echo "::error::Universal APK is missing $abi"
                  exit 1
                }
              done
            else
              [[ "$native_code" == *"'$label'"* ]] || {
                echo "::error::APK is missing native libraries for $label"
                exit 1
              }
            fi

            signing_output="$("$tools/apksigner" verify --verbose "$source")"
            grep -Fq \
              "Verified using v2 scheme (APK Signature Scheme v2): true" \
              <<< "$signing_output" || {
                echo "::error::APK v2 signature verification failed: $source"
                exit 1
              }

            cp "$source" "$destination"
          done

      - name: Upload APKs to existing release
        if: ${{ steps.existing.outputs.has_all != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          gh release upload "$TAG" dist/*.apk --clobber

          echo "APK upload completed for release $TAG."
          echo "Release title and description were not modified."
