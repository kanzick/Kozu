name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version_name:
        description: VersionName
        required: true
        type: string
      version_code:
        description: VersionCode
        required: false
        type: string
      minify:
        description: R8 optimization
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Determine Version and Tag
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version_name }}
          TAG_REF: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          version="$INPUT_VERSION"
          if [ -z "$version" ] && [[ "$TAG_REF" =~ ^v[0-9] ]]; then
            version="${TAG_REF#v}"
          fi
          if [ -z "$version" ]; then
            version="$(python3 -c 'import re; content=open("app/build.gradle.kts", encoding="utf-8").read(); m=re.search(r"versionName\s*=\s*\"([^\"]+)\"", content); print(m.group(1) if m else "1.0")')"
          }
          
          tag="v$version"
          if [[ "$TAG_REF" =~ ^v ]] && [ "$EVENT_NAME" = "push" ]; then
            tag="$TAG_REF"
            version="${tag#v}"
          elif [ "$EVENT_NAME" = "release" ]; then
            tag="${{ github.event.release.tag_name }}"
            version="${tag#v}"
          fi

          code="${{ inputs.version_code }}"
          if [ -z "$code" ]; then
            code="$(date +%s)"
          fi

          echo "version=$version" >> $GITHUB_OUTPUT
          echo "tag=$tag" >> $GITHUB_OUTPUT
          echo "code=$code" >> $GITHUB_OUTPUT

      - name: Prepare Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            python3 -c 'import base64, os; open(os.path.join(os.environ["RUNNER_TEMP"], "release.jks"), "wb").write(base64.b64decode(os.environ["ANDROID_KEYSTORE_BASE64"]))'
          fi

      - name: Build Release APKs
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APP_VERSION_NAME: ${{ steps.version.outputs.version }}
          APP_VERSION_CODE: ${{ steps.version.outputs.code }}
          MINIFY: ${{ inputs.minify || 'true' }}
        run: |
          ./gradlew :app:assembleRelease --stacktrace \
            "-PappVersion=$APP_VERSION_NAME" \
            "-PappVersionCode=$APP_VERSION_CODE" \
            "-PminifyRelease=$MINIFY"

      - name: Package APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/ || true

      - name: Ensure Tag Exists and Push if Needed
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          TAG: ${{ steps.version.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Upload or Update Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: dist/*
          fail_on_unmatched_files: false
          draft: false
          prerelease: false
