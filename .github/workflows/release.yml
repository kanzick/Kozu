name: Release Android APK

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version_name:
        description: versionName (major.minor.patch)
        required: true
        type: string
      version_code:
        description: versionCode (optional)
        required: false
        type: string
      minify:
        description: R8 optimization
        required: false
        type: boolean
        default: true
      smoke_test:
        description: Test APK
        required: false
        type: boolean
        default: true
      prerelease:
        description: Mark the release as a pre-release
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.version_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version_name: ${{ steps.version.outputs.name }}
      code: ${{ steps.version.outputs.code }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          java-version: "25"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Validate release settings
        id: version
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RELEASE_VERSION_INPUT: ${{ github.event.release.tag_name || inputs.version_name || github.ref_name }}
          RELEASE_VERSION_CODE: ${{ inputs.version_code }}
          RELEASE_EVENT_NAME: ${{ github.event_name }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "::error::Missing ANDROID_KEYSTORE_BASE64 secret"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "::error::Missing ANDROID_KEYSTORE_PASSWORD secret"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "::error::Missing ANDROID_KEY_ALIAS secret"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "::error::Missing ANDROID_KEY_PASSWORD secret"; exit 1; }

          version="$RELEASE_VERSION_INPUT"
          version="${version#v}"
          
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || {
            echo "::error::Version must use MAJOR.MINOR.PATCH format"
            exit 1
          }

          code="$RELEASE_VERSION_CODE"
          if [ -z "$code" ]; then code="$(date +%s)"; fi

          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Prepare release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          python3 -c 'import base64, os, pathlib; pathlib.Path(os.environ["RUNNER_TEMP"], "kozu-release.jks").write_bytes(base64.b64decode(os.environ["ANDROID_KEYSTORE_BASE64"], validate=True))'

      - name: Build signed release APK variants
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/kozu-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APP_VERSION_NAME: ${{ steps.version.outputs.name }}
          APP_VERSION_CODE: ${{ steps.version.outputs.code }}
          MINIFY: ${{ inputs.minify || 'true' }}
        run: |
          ./gradlew :app:assembleRelease --stacktrace \
            "-PappVersion=$APP_VERSION_NAME" \
            "-PappVersionCode=$APP_VERSION_CODE" \
            "-PminifyRelease=$MINIFY"

      - name: Verify and package APK variants
        env:
          RELEASE_VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          tools="$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)"
          output="app/build/outputs/apk/release"
          mkdir -p dist
          variants=(
            "universal:app-universal-release.apk"
            "arm64-v8a:app-arm64-v8a-release.apk"
            "armeabi-v7a:app-armeabi-v7a-release.apk"
            "x86:app-x86-release.apk"
            "x86_64:app-x86_64-release.apk"
          )
          for variant in "${variants[@]}"; do
            label="${variant%%:*}"
            source="$output/${variant#*:}"
            destination="dist/app-${label}.apk"
            test -f "$source" || { exit 1; }
            cp "$source" "$destination"
          done

      - name: Upload release files
        uses: actions/upload-artifact@v7
        with:
          name: release-files
          path: dist/*
          retention-days: 3

  smoke-test:
    name: Test APK
    needs: build
    if: ${{ github.event_name == 'release' || inputs.smoke_test }}
    runs-on: ubuntu-latest
    steps:
      - name: Download release files
        uses: actions/download-artifact@v8
        with:
          name: release-files
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          script: bash .github/scripts/smoke_test.sh apk/app-universal.apk logcat.txt

  publish:
    name: Upload Assets to Release
    needs: [build, smoke-test]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Download release files
        uses: actions/download-artifact@v8
        with:
          name: release-files
          path: dist

      - name: Upload Assets to Existing Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || format('v{0}', needs.build.outputs.version_name) }}
          files: dist/*
