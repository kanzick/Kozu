name: Cleanup

on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:
    inputs:
      keep_runs:
        description: Workflow runs to keep
        required: false
        default: "1"
        type: string
      artifact_days:
        description: Artifact days to keep
        required: false
        default: "1"
        type: string
      keep_releases:
        description: Releases to keep
        required: false
        default: "1"
        type: string

permissions:
  actions: write
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      KEEP_RUNS: ${{ inputs.keep_runs || '10' }}
      ARTIFACT_DAYS: ${{ inputs.artifact_days || '5' }}
      KEEP_RELEASES: ${{ inputs.keep_releases || '20' }}

    steps:
      - name: Delete old workflow runs
        run: |
          gh api --paginate "repos/$REPO/actions/workflows" --jq '.workflows[].id' | while read -r workflow; do
            gh api --paginate "repos/$REPO/actions/workflows/$workflow/runs?status=completed&per_page=100" \
              --jq '.workflow_runs[] | [.id, .created_at] | @tsv' \
              | sort -k2 -r \
              | tail -n +"$((KEEP_RUNS + 1))" \
              | cut -f1 \
              | while read -r run; do
                  gh api -X DELETE "repos/$REPO/actions/runs/$run" || true
                done
          done

      - name: Delete old artifacts
        run: |
          cutoff="$(date -u -d "-$ARTIFACT_DAYS days" +%Y-%m-%dT%H:%M:%SZ)"
          gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.created_at < \"$cutoff\") | .id" \
            | while read -r artifact; do
                gh api -X DELETE "repos/$REPO/actions/artifacts/$artifact" || true
              done

      - name: Delete old releases
        if: ${{ env.KEEP_RELEASES != '0' }}
        run: |
          gh api --paginate "repos/$REPO/releases?per_page=100" \
            --jq '.[] | select(.draft == false) | [.id, .tag_name, .created_at] | @tsv' \
            | sort -k3 -r \
            | tail -n +"$((KEEP_RELEASES + 1))" \
            | while IFS=$'\t' read -r id tag _; do
                gh api -X DELETE "repos/$REPO/releases/$id" || true
                gh api -X DELETE "repos/$REPO/git/refs/tags/$tag" || true
              done
