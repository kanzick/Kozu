name: Build

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          java-version: '27'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v6

      - name: Generate versionCode from commit history
        id: version
        shell: bash
        run: |
          set -euo pipefail
          code="$(git rev-list --count HEAD)"
          if [[ ! "$code" =~ ^[1-9][0-9]*$ ]] || (( code > 2100000000 )); then
            echo "::error::Generated versionCode is outside Android's valid range: $code"
            exit 1
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Check Debug build
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace "-PappVersionCode=${{ steps.version.outputs.code }}"
