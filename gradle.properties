kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx4g -XX:+UseG1GC
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.daemon=false #turn on for faster builds if you have so much RAM =)
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.tooling.parallel=true
